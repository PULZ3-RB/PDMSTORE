<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso empleados | PDMSTORE</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="auth-page">
  <a class="back-link" href="index.html">← Volver al catálogo</a>

  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">PDMSTORE STAFF</p>
      <h1>Iniciar sesión</h1>
      <p class="muted">Acceso exclusivo para empleados autorizados.</p>

      <form id="loginForm">
        <label>Usuario</label>
        <input id="username" autocomplete="username" required>

        <label>Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="loginBtn" class="primary-btn" type="submit">Entrar</button>
        <p id="loginMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <script>
    (async () => {
      const me = await fetch('/api/me', { cache: 'no-store' });
      if (me.ok) location.href = 'panel.html';
    })().catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const btn = document.getElementById('loginBtn');
      const message = document.getElementById('loginMessage');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      message.textContent = '';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || 'No se pudo iniciar sesión.');
        location.href = 'panel.html';
      } catch (error) {
        message.textContent = error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
